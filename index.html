<!DOCTYPE html>
<html lang=”en” manifest="/cache.appcache">
    <head>
        <!-- Website Title & Icon -->
        <title>CoderKachi</title>
        <link rel="icon" type="image/x-icon" href="/assets/icons/icon_website.svg">

        <!-- Other -->
        <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Download font from Google -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">

        <!-- Load styles -->
        <link rel="stylesheet" href="/styles/primary.css">
        <link rel="stylesheet" href="/styles/banner.css">
        <link rel="stylesheet" href="/styles/card.css">
        <link rel="stylesheet" href="/styles/tags.css">
        <link rel="stylesheet" href="/styles/navbar.css">
        <link rel="stylesheet" href="/styles/collapsible.css">
        <link rel="stylesheet" href="/styles/codesnippet.css">
        <link rel="stylesheet" href="/styles/mobile.css">

        <!-- Load icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
 
        <!-- Load CSS animations -->
        <link rel="stylesheet" href="/styles/animations.css">
    </head>

    <!-- The Page -->
    <body class="root">

        <!-- STATIC CONTENT -->
        <div class="banner" id="banner">
            <div class="banner-content">
                <!-- Name & Socials -->
                <div class="banner_upper">
                    <div class="banner-text">
                        <h1>CODER KACHI</h1>
                        <p class="font-default">ALAN</p>
                    </div>
                    <div class="social-icons">
                        <a href="https://github.com/CoderKachi" target="_blank"><img src="assets/icons/icon_github.svg" alt="GitHub" class="social-icon"></a>
                        <a href="https://www.linkedin.com/in/alan-robinson-8522b6215/" target="_blank"><img src="assets/icons/icon_linkedin.svg" alt="Linkedin" class="social-icon"></a>
                        <a href="https://itch.io/profile/coderkachi" target="_blank"><img src="assets/icons/icon_itchio.svg" alt="icho.io" class="social-icon"></a>
                    </div>
                </div>
                <!-- Navigation Bar -->
                <div class="banner_lower">
                    <div class="nav_container">
                        <nav>
                            <ul>
                                <li><a href="" id="home" class="selected">A B O U T</a></li>
                                <li><a href="" id="projects">P R O J E C T S</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>

        <!-- To hide top 32px (16px on mobile) -->
        <div class="banner_mask"></div>
        
        <!-- DYNAMIC CONTENT -->
        <div id="dynamic_content"></div>

        <script type="module" src="scripts/content_loader.js"></script>
        <script src="scripts/banner_parallax.js"></script>
    </body>
